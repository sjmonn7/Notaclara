<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NotaClara</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="app">
      <aside class="lateral">
        <div class="marca">
          <div class="logo" aria-hidden="true">N</div>
          <div>
            <h1>NotaClara</h1>
            <p>Analista Programador · INACAP</p>
          </div>
        </div>
        <nav class="semestres" id="semestres" aria-label="Semestres"></nav>
      </aside>

      <main class="contenido" id="contenido" tabindex="-1"></main>
    </div>

    <div class="fondo-modal" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-texto">
        <p id="modal-texto"></p>
        <div class="modal-botones">
          <button type="button" class="boton boton--principal" id="modal-aceptar">Sí</button>
          <button type="button" class="boton" id="modal-cancelar">Cancelar</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
